{% load wagtailcore_tags %}
{% if value.tip_type == "danger" %}
<div class="guide-tip-card danger">
{% elif value.tip_type == "warning" %}
<div class="guide-tip-card warning">
{% elif value.tip_type == "info" %}
<div class="guide-tip-card info">
{% else %}
<div class="guide-tip-card tip">
{% endif %}
    {% if value.title %}<h4 class="guide-tip-title">{{ value.title }}</h4>{% endif %}
    <div class="guide-tip-body">{{ value.content }}</div>
</div>
