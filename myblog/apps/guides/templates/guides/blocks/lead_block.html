{% load wagtailcore_tags %}
<div class="guide-lead-card">
    <h3 class="guide-lead-title">{{ value.title }}</h3>
    {% if value.prerequisites %}
        <div class="prerequisites guide-lead-prereq">
            <strong>先决条件与环境准备：</strong>
            {{ value.prerequisites }}
        </div>
    {% endif %}
    <div class="overview guide-lead-overview">
        {{ value.overview }}
    </div>
</div>
