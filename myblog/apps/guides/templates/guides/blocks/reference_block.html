<div class="guide-ref-card" style="background:#fff;border:1px dashed #cbd5e1;padding:12px 18px;border-radius:6px;margin:12px 0;">
    <a href="{{ value.url }}" target="_blank" rel="noopener noreferrer" style="color:#0284c7;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
        🔗 {{ value.title }}
    </a>
    {% if value.description %}
        <span style="color:#64748b;font-size:13px;margin-left:8px;">— {{ value.description }}</span>
    {% endif %}
</div>
