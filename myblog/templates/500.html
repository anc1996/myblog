<!DOCTYPE html>
<html lang="zh-Hans" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <title>服务器暂时出现异常 (500)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                --err-bg: #eef2f7;
                --err-surface: #f8fafc;
                --err-border: #d3dce8;
                --err-text: #0f172a;
                --err-muted: #475569;
                --err-badge-bg: #fee2e2;
                --err-badge-text: #7f1d1d;
                --err-primary: #1d4ed8;
                --err-on-primary: #ffffff;
                color-scheme: light;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --err-bg: #151b25;
                    --err-surface: #1e2836;
                    --err-border: #334155;
                    --err-text: #f1f5f9;
                    --err-muted: #94a3b8;
                    --err-badge-bg: rgba(220, 38, 38, 0.22);
                    --err-badge-text: #fecaca;
                    --err-primary: #93c5fd;
                    --err-on-primary: #0f172a;
                    color-scheme: dark;
                }
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px 16px;
                background: var(--err-bg);
                color: var(--err-text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                line-height: 1.6;
            }
            .err-card {
                width: 100%;
                max-width: 620px;
                padding: 36px 28px;
                border-radius: 12px;
                border: 1px solid var(--err-border);
                background: var(--err-surface);
                text-align: center;
            }
            .err-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 12px;
                border-radius: 999px;
                background: var(--err-badge-bg);
                color: var(--err-badge-text);
                font-size: 13px;
                font-weight: 700;
            }
            h1 {
                margin: 16px 0 8px;
                font-size: 26px;
                line-height: 1.3;
            }
            p {
                margin: 0 auto 24px;
                max-width: 480px;
                color: var(--err-muted);
                font-size: 15px;
            }
            .err-actions {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px;
            }
            .err-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 40px;
                padding: 8px 18px;
                border-radius: 8px;
                border: 1px solid var(--err-border);
                background: transparent;
                color: var(--err-text);
                text-decoration: none;
                font-size: 14px;
                font-weight: 600;
            }
            .err-btn-primary {
                border-color: var(--err-primary);
                background: var(--err-primary);
                color: var(--err-on-primary);
            }
        </style>
    </head>
    <body>
        <main class="err-card">
            <span class="err-badge">HTTP 500</span>
            <h1>服务器暂时出现异常</h1>
            <p>抱歉，处理当前请求时发生内部错误。请稍后刷新页面重试，或返回站点首页继续浏览。</p>
            <div class="err-actions">
                <a href="/" class="err-btn err-btn-primary">返回首页</a>
                <a href="" class="err-btn">刷新当前页</a>
            </div>
        </main>
    </body>
</html>
