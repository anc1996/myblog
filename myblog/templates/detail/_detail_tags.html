{% if detail.tag_links %}
<div class="detail-tags-list" aria-label="内容标签">
    {% for t in detail.tag_links %}
        {% if t.url %}
            <a href="{{ t.url }}" class="tag-pill">#{{ t.name }}</a>
        {% else %}
            <span class="tag-pill">#{{ t.name }}</span>
        {% endif %}
    {% endfor %}
</div>
{% endif %}
