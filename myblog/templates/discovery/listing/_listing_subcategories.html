{% if view_model.navigation_items %}
<section class="listing-subcategories" aria-label="子栏目导航">
  <div class="listing-subcat-header">
    <span class="listing-subcat-title">子栏目导航</span>
    <span class="listing-subcat-count">本栏目下属直接子分类目录（共 {{ view_model.navigation_total_count }} 个）</span>
  </div>
  <div class="listing-subcat-grid">
    {% for sub in view_model.navigation_items %}
      <a href="{{ sub.url }}" class="listing-subcat-chip">
        <span class="listing-subcat-name">{{ sub.title }}</span>
        {% if sub.summary %}
          <span class="listing-subcat-desc" title="{{ sub.summary }}">{{ sub.summary|truncatechars:20 }}</span>
        {% endif %}
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
