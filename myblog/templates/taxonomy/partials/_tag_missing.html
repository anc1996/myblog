<div class="tag-missing-shell">
  <div class="tag-missing-icon" aria-hidden="true">
    {% include "includes/_ui_icon.html" with name="tag" %}
  </div>
  <h2 class="tag-missing-title">未找到与标签 #{{ data.tag_slug }} 相关的公开内容</h2>
  <p class="tag-missing-desc">
    该标签可能尚未包含已发布的公开文章，或已被合并/调整。
  </p>

  {% if data.recommended_tags %}
    <div class="tag-recommendations tag-recommendations-box">
      <h3 class="tag-recommendations-title">为您推荐以下活跃技术标签：</h3>
      <div class="tag-recommendations-list">
        {% for rec in data.recommended_tags %}
          <a href="{{ rec.url }}" class="tag-cloud-item">
            <span>#{{ rec.name }}</span>
            <span class="tag-cloud-count">{{ rec.count }}</span>
          </a>
        {% endfor %}
      </div>
    </div>
  {% endif %}

  <a href="{{ data.directory_url }}" class="ui-btn ui-btn-primary">
    &larr; 返回全站标签大厅浏览全部标签
  </a>
</div>
